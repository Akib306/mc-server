services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: mc-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      TYPE: "${MC_SERVER_TYPE:-PAPER}"
      VERSION: "${MC_VERSION:-LATEST}"
      MEMORY: "${MC_MEMORY:-2G}"
      MOTD: "${MC_MOTD:-Docker Minecraft Server}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      ONLINE_MODE: "${MC_ONLINE_MODE:-TRUE}"
    ports:
      - "${MC_PORT:-25565}:25565"
    volumes:
      - mc_data:/data

  ngrok:
    image: ngrok/ngrok:latest
    container_name: mc-ngrok
    restart: unless-stopped
    depends_on:
      - minecraft
    environment:
      NGROK_AUTHTOKEN: "${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}"
    command:
      - tcp
      - minecraft:25565
      - --log=stdout

volumes:
  mc_data:
