services:
  vanilla-hardcore:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanilla-hardcore
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25566:25565"
    environment:
      EULA: "${EULA:-FALSE}"
      MINECRAFT_VERSION: "26.2"
      MIN_RAM: "1G"
      MAX_RAM: "4G"
    volumes:
      - ./data:/data
    mem_limit: 6g
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/25565'"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 60s
