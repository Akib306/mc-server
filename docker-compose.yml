services:
  cobblemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobblemon-optimized
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "25567:25565"
    environment:
      EULA: "${EULA:-FALSE}"
      MIN_RAM: "${MIN_RAM:-2G}"
      MAX_RAM: "${MAX_RAM:-8G}"
    volumes:
      - ./server:/data
    mem_limit: 10g
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/25565'"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 2m
